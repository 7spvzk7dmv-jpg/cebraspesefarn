<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistema de Questões</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- HEADER MOBILE -->
<header class="bg-gray-900 text-white flex items-center justify-between p-4 md:hidden">
  <h1 class="font-bold">Questões</h1>
  <button onclick="toggleMenu()">☰</button>
</header>

<div class="flex">

  <!-- SIDEBAR -->
  <aside id="menu"
    class="bg-gray-900 text-white w-64 p-4 space-y-2
           fixed md:static inset-y-0 left-0 transform
           -translate-x-full md:translate-x-0 transition">
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-4 md:p-6 space-y-6">

    <!-- PLACAR -->
    <div class="bg-white rounded shadow p-4 flex flex-col md:flex-row justify-between gap-2">
      <div id="placarGeral"></div>
      <div id="placarDisc"></div>
    </div>

    <!-- QUESTÃO -->
    <div id="questaoBox" class="bg-white rounded shadow p-4 space-y-4 hidden">
      <div id="enunciado" class="font-semibold"></div>
      <div id="alternativas" class="space-y-2"></div>

      <div class="flex gap-2 flex-wrap">
        <button onclick="confirmar()"
          class="bg-blue-600 text-white px-4 py-2 rounded">
          Confirmar
        </button>

        <button onclick="mostrarGabarito()"
          id="btnGabarito"
          class="bg-gray-600 text-white px-4 py-2 rounded hidden">
          Ver gabarito
        </button>

        <button onclick="proxima()"
          class="bg-green-600 text-white px-4 py-2 rounded">
          Próxima
        </button>
      </div>

      <div id="feedback" class="font-semibold"></div>
      <div id="comentario" class="text-sm text-gray-700"></div>
    </div>

  </main>
</div>

<script>
/* ================= CONFIG ================= */
const DISCIPLINAS = {
  ALL: { nome: "Todas", arquivo: null },
  port: { nome: "Português", arquivo: "port.json" },
  const: { nome: "Constitucional", arquivo: "const.json" },
  adm: { nome: "Administrativo", arquivo: "adm.json" },
  com: { nome: "Comercial", arquivo: "com.json" },
  civ: { nome: "Civil", arquivo: "civ.json" },
  pen: { nome: "Penal", arquivo: "pen.json" },
  fin: { nome: "Financeiro", arquivo: "fin.json" },
  eco: { nome: "Economia", arquivo: "eco.json" },
  cg: { nome: "Contab. Geral", arquivo: "cg.json" },
  hrn: { nome: "Hist. RN", arquivo: "hrn.json" },
  aud: { nome: "Auditoria", arquivo: "aud.json" },
  mat: { nome: "Matemática", arquivo: "mat.json" },
  ti: { nome: "TI", arquivo: "ti.json" },
  tg: { nome: "Tributário", arquivo: "tg.json" },
  rt: { nome: "Reforma Trib.", arquivo: "rt.json" },
  cc: { nome: "Contab. Custos", arquivo: "cc.json" },
  te: { nome: "Trib. Estadual", arquivo: "te.json" },
  pat: { nome: "Proc. Adm. Trib.", arquivo: "pat.json" }
};

let disciplinaAtual = "ALL";
let questoes = [];
let questaoAtual = null;
let respondeu = false;

/* ================= MENU ================= */
function toggleMenu() {
  document.getElementById("menu").classList.toggle("-translate-x-full");
}

function montarMenu() {
  const menu = document.getElementById("menu");
  menu.innerHTML = "<h2 class='font-bold mb-4'>Disciplinas</h2>";

  Object.entries(DISCIPLINAS).forEach(([key, d]) => {
    const btn = document.createElement("button");
    btn.textContent = d.nome;
    btn.className = "w-full text-left px-2 py-1 rounded hover:bg-gray-700";
    btn.onclick = () => selecionarDisciplina(key);
    menu.appendChild(btn);
  });
}

/* ================= STORAGE ================= */
function getStats() {
  return JSON.parse(localStorage.getItem("stats")) || {
    geral: { acertos: 0, erros: 0 },
    disciplinas: {},
    errosQuestao: {}
  };
}

function saveStats(s) {
  localStorage.setItem("stats", JSON.stringify(s));
}

/* ================= LOAD ================= */
async function selecionarDisciplina(key) {
  disciplinaAtual = key;
  questoes = [];

  const entradas = key === "ALL"
    ? Object.entries(DISCIPLINAS).filter(([k]) => k !== "ALL")
    : [[key, DISCIPLINAS[key]]];

  for (const [k, d] of entradas) {
    const res = await fetch(`./data/${d.arquivo}`);
    const data = await res.json();
    data.forEach(q => {
      q._uid = `${k}_${q.id}`;
      q._disc = k;
      questoes.push(q);
    });
  }

  sorteiaQuestao();
  atualizarPlacar();
  toggleMenu();
}

/* ================= SORTEIO ================= */
function sorteiaQuestao() {
  respondeu = false;
  document.getElementById("feedback").textContent = "";
  document.getElementById("comentario").textContent = "";
  document.getElementById("btnGabarito").classList.add("hidden");

  const stats = getStats();

  const pool = questoes.map(q => {
    const erros = stats.errosQuestao[q._uid] || 0;
    return { q, peso: 1 + erros * 2 };
  });

  let total = pool.reduce((s, p) => s + p.peso, 0);
  let r = Math.random() * total;

  for (const p of pool) {
    if (r < p.peso) {
      questaoAtual = p.q;
      break;
    }
    r -= p.peso;
  }

  render();
}

/* ================= RENDER ================= */
function render() {
  document.getElementById("questaoBox").classList.remove("hidden");
  document.getElementById("enunciado").textContent = questaoAtual.enunciado;

  const alt = document.getElementById("alternativas");
  alt.innerHTML = "";

  for (const k in questaoAtual.alternativas) {
    alt.innerHTML += `
      <label class="block">
        <input type="radio" name="alt" value="${k}">
        <span class="ml-2">${k}) ${questaoAtual.alternativas[k]}</span>
      </label>`;
  }
}

/* ================= CONFIRMAR ================= */
function confirmar() {
  if (respondeu) return;

  const marcada = document.querySelector('input[name="alt"]:checked');
  if (!marcada) return alert("Selecione uma alternativa.");

  respondeu = true;
  const stats = getStats();
  const correta = questaoAtual.gabarito;

  stats.disciplinas[questaoAtual._disc] ??= { acertos: 0, erros: 0 };

  if (marcada.value === correta) {
    stats.geral.acertos++;
    stats.disciplinas[questaoAtual._disc].acertos++;
    document.getElementById("feedback").textContent = "✅ Correta";
  } else {
    stats.geral.erros++;
    stats.disciplinas[questaoAtual._disc].erros++;
    stats.errosQuestao[questaoAtual._uid] =
      (stats.errosQuestao[questaoAtual._uid] || 0) + 1;
    document.getElementById("feedback").textContent =
      `❌ Errada. Correta: ${correta}`;
  }

  saveStats(stats);
  document.getElementById("btnGabarito").classList.remove("hidden");
  atualizarPlacar();
}

function mostrarGabarito() {
  document.getElementById("comentario").textContent =
    questaoAtual.comentario;
}

function proxima() {
  sorteiaQuestao();
}

/* ================= PLACAR ================= */
function atualizarPlacar() {
  const s = getStats();
  document.getElementById("placarGeral").textContent =
    `Geral ✔ ${s.geral.acertos} | ❌ ${s.geral.erros}`;

  if (disciplinaAtual !== "ALL") {
    const d = s.disciplinas[disciplinaAtual] || { acertos: 0, erros: 0 };
    document.getElementById("placarDisc").textContent =
      `${DISCIPLINAS[disciplinaAtual].nome} ✔ ${d.acertos} | ❌ ${d.erros}`;
  } else {
    document.getElementById("placarDisc").textContent = "";
  }
}

/* ================= INIT ================= */
montarMenu();
selecionarDisciplina("ALL");
</script>

</body>
</html>
